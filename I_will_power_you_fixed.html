(()=> {
const A=['←','↓','↑','→'];
const music=document.getElementById('music'), miss=document.getElementById('miss');
const overlay=document.getElementById('overlay'), start=document.getElementById('start');
const gf=document.getElementById('gf'), left=document.getElementById('bfLeft'), right=document.getElementById('bfRight');
const NR=document.getElementById('notesRight'), msg=document.getElementById('msg'), hp=document.getElementById('hp');
const lanes=[...document.querySelectorAll('#lanesRight .lane')];
const idle='https://static.wikia.nocookie.net/friday-night-funkinn/images/5/5b/Boyfriend.gif/revision/latest?cb=20221230221743&path-prefix=ru';
const moves=[
'https://fridaynightfunkin.wiki.gg/images/BoyfriendLeft.gif?97b850&format=original',
'https://fridaynightfunkin.wiki.gg/images/BoyfriendDown.gif?829e61&format=original',
'https://fridaynightfunkin.wiki.gg/images/BoyfriendUp.gif?df3e97&format=original',
'https://fridaynightfunkin.wiki.gg/images/BoyfriendRight.gif?56a279&format=original'
];
let running=false, raf=0, notes=[], chart=[], score=0, nextIndex=0;
const duration=11.911, travel=1.35, firstNote=1.0, interval=.55;

left.style.transform='scaleX(-1)';
right.style.transform='scaleX(1)';

function makeChart(){
  chart=[];
  for(let t=firstNote,i=0;t<duration-.1;t+=interval,i++) chart.push({t,l:i%4});
  nextIndex=0;
}
function laneRect(l){ return lanes[l].getBoundingClientRect(); }

function spawn(n){
  const r=laneRect(n.l);
  const e=document.createElement('div');
  e.className='note';
  e.textContent=A[n.l];
  e.dataset.lane=n.l;
  e.style.left=r.left+'px';
  e.style.top='-60px';
  NR.appendChild(e);
  notes.push({e,t:n.t,l:n.l});
}
function press(l){
  if(!running)return;
  lanes[l].classList.add('active');
  setTimeout(()=>lanes[l]?.classList.remove('active'),100);
  let best=null, bestD=Infinity;
  const target=laneRect(l);
  for(const n of notes){
    if(n.l!==l)continue;
    const r=n.e.getBoundingClientRect();
    const d=Math.abs((r.top+r.height/2)-(target.top+target.height/2));
    if(d<bestD){bestD=d;best=n}
  }
  if(best && bestD<55){
    best.e.remove();
    notes=notes.filter(n=>n!==best);
    score++;
    right.src=moves[l];
    setTimeout(()=>{if(running)right.src=idle},180);
    msg.textContent='ПОПАДАНИЕ!';
    hp.style.width=Math.max(20,100-score*2)+'%';
  }else{
    msg.textContent='ПРОМАХ';
    try{miss.currentTime=0;miss.play()}catch(e){}
    const currentHP=parseFloat(hp.style.width||'100');
    const newHP=Math.max(0,currentHP-20);
    hp.style.width=newHP+'%';
    if(newHP<=0){gameOver('ПОЛОСКА НА КРАЮ — ТЫ ПРОИГРАЛ!');return;}
  }
}
function loop(){
  if(!running)return;
  const now=music.currentTime;
  if(now>=duration-.03){finish();return}

  while(nextIndex<chart.length && chart[nextIndex].t-travel<=now){
    spawn(chart[nextIndex++]);
  }

  for(const n of [...notes]){
    const target=laneRect(n.l);
    const startY=-60;
    const endY=target.top;
    const p=Math.max(0,Math.min(1,(now-(n.t-travel))/travel));
    n.e.style.left=target.left+'px';
    n.e.style.top=(startY+(endY-startY)*p)+'px';
    if(now>n.t+.10){
      n.e.remove();
      notes=notes.filter(x=>x!==n);
      msg.textContent='ПРОМАХ';
      try{miss.currentTime=0;miss.play()}catch(e){}
      const currentHP=parseFloat(hp.style.width||'100');
      const newHP=Math.max(0,currentHP-20);
      hp.style.width=newHP+'%';
      if(newHP<=0){gameOver('ПОЛОСКА НА КРАЮ — ТЫ ПРОИГРАЛ!');return;}
    }
  }
  raf=requestAnimationFrame(loop);
}
function begin(){
  running=true; score=0; notes=[]; NR.innerHTML=''; hp.style.width='100%'; msg.textContent='ГОТОВО';
  makeChart();
  overlay.style.display='none';
  music.currentTime=0;
  music.play().catch(()=>{msg.textContent='Нажми ИГРАТЬ для запуска музыки'});
  gf.src='https://fridaynightfunkin.wiki.gg/images/Gfboombox.gif?df0584&format=original';
  setTimeout(()=>{if(running)gf.src='https://fridaynightfunkin.wiki.gg/images/GF_FEAR.gif?ec9f09&format=original'},5000);
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
function gameOver(text){
  running=false;
  music.pause();
  for(const n of notes)n.e.remove();
  notes=[];
  msg.textContent=text;
  overlay.style.display='flex';
  overlay.querySelector('p').textContent=text;
}
function finish(){
  running=false;
  music.pause();
  for(const n of notes)n.e.remove();
  notes=[];
  overlay.style.display='flex';
  msg.textContent='Музыка закончилась';
}
start.onclick=begin;
document.addEventListener('keydown',e=>{
  const m={ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3,a:0,s:1,w:2,d:3};
  if(m[e.key]!==undefined){e.preventDefault();press(m[e.key]);}
});
lanes.forEach(x=>x.addEventListener('pointerdown',e=>{e.preventDefault();press(+x.dataset.lane)}));
})();
</script></body></html>
